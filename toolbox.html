<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="limpieza.webmanifest"><link rel="icon" href="limp-192.png"><link rel="apple-touch-icon" href="limp-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Toolbox HSE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#1F4E79; --navy-2:#2E6DA4; --blue:#0b6bcb; --blue-soft:#e8f1fc;
  --ok:#1f8a4c; --ok-soft:#e5f5ec; --warn:#b26a00; --warn-soft:#fff3df; --bad:#c0392b; --bad-soft:#fdecea;
  --bg:#f3f4f8; --card:#ffffff; --ink:#1c2233; --muted:#667085; --line:#e3e6ee;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.h2{font-size:15px;font-weight:700;color:var(--navy);margin:20px 2px 8px;text-transform:uppercase;letter-spacing:.6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--navy);color:#fff;min-height:46px}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px;min-height:auto}
.btn.ok{background:var(--ok)}
.btn.bad{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.big{width:100%;font-size:18px;min-height:56px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef0f5;color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
/* login */
.login-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.who{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;font-weight:600;min-height:58px}
.who.admin{border-color:var(--navy)}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);display:block}
.pin-dots i.f{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{height:64px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:600}
/* meses */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.mcard.now{border:2px solid var(--blue)}
.mcard.off{background:#f8f9fb;color:var(--muted)}
.mcard .mn{font-weight:750;font-size:17px;color:var(--navy)}
.mcard .tt{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:#eef0f5;border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok)}
/* lectura */
.hero{width:100%;border-radius:12px;display:block;aspect-ratio:3/1;object-fit:cover;background:#dde}
.compromiso{color:var(--blue);font-size:21px;font-weight:750;line-height:1.25;margin:14px 0 10px}
.tema{color:var(--blue);font-size:19px;font-weight:750;margin:0 0 8px}
.read p{margin:0 0 10px}
.read ul{margin:0 0 6px;padding-left:20px}
.read li{margin-bottom:6px}
.qs{background:var(--blue-soft);border-radius:12px;padding:12px 14px;margin-top:6px}
.qs b{display:block;margin-bottom:6px;color:var(--navy)}
/* firma */
.sigbox{position:relative;border:2px dashed #b8bfd0;border-radius:12px;background:#fff;touch-action:none;height:200px}
.sigbox canvas{width:100%;height:100%;display:block;border-radius:10px}
.sigbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a0a7b8;pointer-events:none;font-size:15px}
.sigline{position:absolute;left:8%;right:8%;bottom:44px;border-bottom:1.5px solid #d4d8e2;pointer-events:none}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:#f6f7fa;margin:12px 0}
.check input{width:24px;height:24px;flex:none;margin-top:1px}
/* listas */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600}
.li img.sg{height:34px;max-width:110px;object-fit:contain}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#cfd4df}
.dot.ok{background:var(--ok)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:11px 12px;border:1px solid #cdd2de;border-radius:10px;background:#fff;min-height:44px}
textarea.inp{min-height:80px;resize:vertical}
.tabs{display:flex;gap:6px;background:#e6e9f1;padding:4px;border-radius:12px;margin:4px 0 14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:650;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet{position:fixed;inset:0;background:rgba(15,20,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2233;color:#fff;padding:12px 18px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:64px;line-height:1}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dk{border-color:#d0d5e0;border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.sticky-act{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom));z-index:4}
.sticky-act>div{max-width:760px;margin:0 auto}
@media (min-width:700px){ .compromiso{font-size:24px} }
</style>
</head>

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ERR = {
  SESION:'Tu sesión ha caducado. Vuelve a entrar.', NO_ADMIN:'Solo el responsable puede hacer esto.',
  CERRADA:'Este mes ya está cerrado.', NO_ENVIADO:'Este Toolbox todavía no te lo han enviado.',
  FIRMA_INVALIDA:'La firma no es válida. Vuelve a firmar.', SIN_TOOLBOX:'Ese mes no tiene Toolbox.',
  PIN_MAL:'PIN incorrecto.', BLOQUEADO:'Demasiados intentos. Espera 10 minutos.', PIN_FORMATO:'El PIN debe tener de 4 a 8 números.',
  NO_EXISTE:'No existe o ya no está disponible.', FALTA_COMPROMISO:'Falta el compromiso del mes.',
  FALTA_FECHA:'Falta la fecha de la formación.', FALTA_TRABAJADOR:'Elige al menos un trabajador.'
};

// ====== Estado ======
const S = { tok:null, yo:null, anio:new Date().getFullYear(), meses:[], mes:null, data:null, trab:[], cfg:{}, tab:'firmas' };
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}} };
S.seccion = ls.get('tb.sec')==='form' ? 'form' : 'toolbox';

// ====== Utilidades ======
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtF = d => { if(!d) return ''; const [y,m,dd]=String(d).slice(0,10).split('-'); return `${dd}/${m}/${y.slice(2)}`; };
const fmtFH = ts => { if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); };
const hoyISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
function toast(msg, err){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?4200:2600); }
async function rpc(fn, args={}){
  let r;
  try{
    r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify(args)});
  }catch(e){ throw new Error('Sin conexión. Revisa la cobertura e inténtalo de nuevo.'); }
  const txt = await r.text();
  if(!r.ok){
    let m=''; try{ m=JSON.parse(txt).message||''; }catch(e){ m=txt; }
    if(m==='SESION'){ salir(true); }
    throw new Error(ERR[m] || m || ('Error '+r.status));
  }
  return txt ? JSON.parse(txt) : null;
}
function busy(btn, on){ if(!btn) return; if(on){ btn.dataset.t=btn.innerHTML; btn.innerHTML='<span class="spin"></span>'; btn.disabled=true; } else { btn.innerHTML=btn.dataset.t||btn.innerHTML; btn.disabled=false; } }
function barra(title, left, right){
  return `<div class="top">${left||''}<h1>${esc(title)}</h1>${right||''}</div>`;
}
function view(html){ $('#app').innerHTML = html; window.scrollTo(0,0); }

// ====== Voz (para quien no lee bien) ======
let hablando=false;
function textoLectura(tb){
  const p=[tb.compromiso, tb.cuerpo||'', (tb.puntos||[]).length?'Puntos para hablar. '+tb.puntos.join(' '):'', tb.tema||'', tb.tema_intro||'', (tb.tema_puntos||[]).join('. ')];
  return p.filter(Boolean).join('. ').replace(/https?:\/\/\S+/g,'');
}
function hablar(btn, texto){
  if(!('speechSynthesis' in window)){ toast('Este móvil no puede leer en voz alta', true); return; }
  if(hablando){ speechSynthesis.cancel(); hablando=false; btn.textContent='🔊 Escuchar'; return; }
  const u=new SpeechSynthesisUtterance(texto); u.lang='es-ES'; u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>/^es(-|_)ES/i.test(v.lang)); if(v) u.voice=v;
  u.onend=u.onerror=()=>{hablando=false; btn.textContent='🔊 Escuchar';};
  speechSynthesis.cancel(); speechSynthesis.speak(u); hablando=true; btn.textContent='⏹ Parar';
}

// ====== Firma (canvas) ======
function sigPad(box){
  const cv=box.querySelector('canvas'), ph=box.querySelector('.ph');
  const ctx=cv.getContext('2d'); let drawing=false, last=null, n=0;
  const api={ onchange:null };
  function size(){
    const r=cv.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
    const old = n? cv.toDataURL(): null;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0d1b4a'; ctx.lineWidth=2.4;
    if(old){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=old; }
  }
  size(); window.addEventListener('resize', size);
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; last=pos(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle='#0d1b4a'; ctx.fill(); n++; ph.style.display='none'; });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; n++; });
  const fin=()=>{ if(drawing){ drawing=false; api.onchange&&api.onchange(); } };
  cv.addEventListener('pointerup',fin); cv.addEventListener('pointercancel',fin); cv.addEventListener('pointerleave',fin);
  api.vacio=()=>n<6;
  api.limpiar=()=>{ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore(); n=0; ph.style.display=''; };
  api.png=()=>{ // recorta y reduce
    const w=cv.width,h=cv.height,data=ctx.getImageData(0,0,w,h).data;
    let x0=w,y0=h,x1=0,y1=0;
    for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){ if(data[(y*w+x)*4+3]>10){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
    if(x1<=x0||y1<=y0){ x0=0;y0=0;x1=w;y1=h; }
    const pad=10; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w,x1+pad); y1=Math.min(h,y1+pad);
    const cw=x1-x0, ch=y1-y0, k=Math.min(1, 160/ch, 520/cw);
    const o=document.createElement('canvas'); o.width=Math.max(1,Math.round(cw*k)); o.height=Math.max(1,Math.round(ch*k));
    o.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,o.width,o.height);
    return o.toDataURL('image/png');
  };
  return api;
}

  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div><div class="row"><b class="grow" style="font-size:18px">${esc(titulo)}</b><button class="btn ghost" data-x>Cerrar</button></div>

  <div class="tabs"><button data-t="firmas" class="${S.tab==='firmas'?'on':''}">Firmas</button><button data-t="datos" class="${S.tab==='datos'?'on':''}">Datos</button><button data-t="contenido" class="${S.tab==='contenido'?'on':''}">Contenido</button></div><div id="tab"></div>`;

function tabFirmas(firmadas, prev, cerrada){
  const lista = S.trab.filter(t=>prev.has(t.id) || firmadas.has(t.id));
  const fuera = S.trab.filter(t=>!prev.has(t.id) && !firmadas.has(t.id));
  // firmas de gente ya inactiva
  const extra = S.data.firmas.filter(f=>!S.trab.some(t=>t.id===f.trabajador));
  let h=`<div class="card">`;
  if(!lista.length && !extra.length) h+=`<div class="empty">No hay nadie convocado.</div>`;
  h += lista.map(t=>{ const f=firmadas.get(t.id);
    return `<div class="li"><span class="dot ${f?'ok':''}"></span><span class="grow"><span class="nm">${esc(t.nombre)}</span><br><span class="small muted">${f?('Firmó '+fmtFH(f.firmado_en)):(t.categoria?esc(t.categoria):'Pendiente')}</span></span>
      ${f?`<img class="sg" src="${f.firma}" alt="">${cerrada?'':`<button class="btn ghost" data-del="${f.id}" title="Borrar firma">✕</button>`}`:
        (cerrada?'':`<button class="btn ghost" data-sig="${t.id}">Firmar aquí</button><button class="btn ghost" data-quit="${t.id}" title="No convocar">−</button>`)}</div>`; }).join('');
  h += extra.map(f=>`<div class="li"><span class="dot ok"></span><span class="grow"><span class="nm">${esc(f.nombre)}</span><br><span class="small muted">Firmó ${fmtFH(f.firmado_en)}</span></span><img class="sg" src="${f.firma}" alt=""></div>`).join('');
  h += `</div>`;
  if(!cerrada && fuera.length){
    h += `<div class="h2">No convocados</div><div class="card">` + fuera.map(t=>`<div class="li"><span class="dot"></span><span class="grow"><span class="nm">${esc(t.nombre)}</span>${t.rol==='admin'?' <span class="chip">admin</span>':''}</span><button class="btn ghost" data-add="${t.id}">+ Convocar</button></div>`).join('') + `</div>`;
  }
  h += `<p class="small muted">“Firmar aquí” sirve para recoger la firma en tu móvil o tablet cuando el trabajador está contigo (por ejemplo, si no usa la app).</p>`;
  $('#tab').innerHTML=h;
  const setPrev = async (ids)=>{ try{ await rpc('prl_sesion_guardar',{p_tok:S.tok,p_anio:S.anio,p_mes:S.mes,p:{previstos:ids}}); await cargarMes(S.mes); pintarMes(); }catch(e){ toast(e.message,true); } };
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>setPrev([...prev, b.dataset.add]));
  document.querySelectorAll('[data-quit]').forEach(b=>b.onclick=()=>setPrev([...prev].filter(x=>x!==b.dataset.quit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar esta firma? El trabajador tendrá que volver a firmar.')) return;
    try{ await rpc('prl_firma_borrar',{p_tok:S.tok,p_id:b.dataset.del}); await cargarMes(S.mes); pintarMes(); }catch(e){ toast(e.message,true); }
  });
  document.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>{
    const t=S.trab.find(x=>x.id===b.dataset.sig);
    hojaFirma(t.nombre, `Toolbox de ${MESES[S.mes-1]}: ${esc(S.data.toolbox.compromiso)}<br>Al firmar confirma que ha recibido esta formación.`, async png=>{

    });
  });
}

// ====== PDF (formato SH-CORP-FO-IB-031) ======
// Convierte una imagen por ruta (img/toolbox/...) en dataURL para el PDF
function aDataURL(src){ if(!src || /^data:/.test(src)) return Promise.resolve(src);
  return new Promise(res=>{ const i=new Image(); i.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=i.naturalWidth; c.height=i.naturalHeight; c.getContext('2d').drawImage(i,0,0); res(c.toDataURL('image/jpeg',.85)); }catch(e){ res(null); } }; i.onerror=()=>res(null); i.src=src; }); }
function imgSize(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>res(null); i.src=src; }); }
async function construirPDF(){
  const { jsPDF } = window.jspdf;
  const d=S.data, tb=d.toolbox, s=sesionDe();
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210, H=297, L=15, R=195, CW=R-L;
  const NAVY=[15,28,77], LBL=[0,51,102], BLUE=[0,112,192], GREY=[242,242,242], BORDER=[191,191,191], TXT=[30,30,30];
  const nombreMes = MESES[S.mes-1];
  const codigo = `SH-CORP-FO-IB-031 Toolbox Talk HSE_${nombreMes} ${String(S.anio).slice(2)}`;
  const FOOT_TOP = H-42;
  const ic = await imgSize(ICONOS), lg = await imgSize(LOGO);
  const sizes = {};
  for(const f of d.firmas){ if(f.firma) sizes[f.id]=await imgSize(f.firma); }
  const formSig = S.cfg.firma_formador ? await imgSize(S.cfg.firma_formador) : null;
  const tbSrc = await aDataURL(tb.imagen); const tbImg = tbSrc ? await imgSize(tbSrc) : null;
  const fmt = src => /^data:image\/png/.test(src)?'PNG':'JPEG';
  const fit = (src, sz, x, y, w, h, align='center') => { if(!src||!sz) return; const k=Math.min(w/sz.w, h/sz.h); const iw=sz.w*k, ih=sz.h*k; const ox = align==='left'?0:(w-iw)/2; doc.addImage(src, fmt(src), x+ox, y+(h-ih)/2, iw, ih); };
  const color = c => doc.setTextColor(c[0],c[1],c[2]);

  function cabecera(){
    doc.setFont('helvetica','bold'); doc.setFontSize(14); color(NAVY);
    doc.text('TOOLBOX TALK / TEAMBOARD / REUNIÓN PERIÓDICA', W/2, 17, {align:'center'});
    doc.text('HSE', W/2, 22.5, {align:'center'});
    doc.setFillColor(GREY[0],GREY[1],GREY[2]); doc.rect(L+10, 26, CW-20, 4, 'F');
    return 36;
  }
  function pie(){
    if(ic) { const w=150, h=w*ic.h/ic.w; doc.addImage(ICONOS,'JPEG',(W-w)/2,FOOT_TOP+2,w,h); }
    doc.setFontSize(6.3); color(TXT);
    const lines=[
      [['Todos los asistentes que firman el presente documento han participado en la actividad formativa (Toolbox Talk) indicada, la cual ha sido',0]],
      [['realizada durante la reunión mensual de ',0],['Team Board (TB)',1],['. En aquellos casos donde ',0],['no es de aplicación el TB',1],[', la actividad formativa se',0]],
      [['ha realizado durante las ',0],['reuniones periódicas de Seguridad y Salud o Medioambiente',1],['.',0]]
    ];
    let y=H-21;
    for(const ln of lines){
      let tw=0; for(const [t,b] of ln){ doc.setFont('helvetica',b?'bold':'normal'); tw+=doc.getTextWidth(t); }
      let x=(W-tw)/2; for(const [t,b] of ln){ doc.setFont('helvetica',b?'bold':'normal'); doc.text(t,x,y); x+=doc.getTextWidth(t); }
      y+=2.9;
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(0,112,192); doc.text('PEOPLE MAKE PLACES', L-5, H-8);
    color(TXT); doc.setFontSize(8); doc.text(String(doc.internal.getCurrentPageInfo().pageNumber), W/2, H-9, {align:'center'});
    doc.setFontSize(6.5); doc.text(codigo, R+5, H-6, {align:'right'});
    if(lg) doc.addImage(LOGO,'PNG',R-17,H-16.5,10,10*lg.h/lg.w);
  }
  // ---- Página 1
  let y=cabecera();
  doc.setFontSize(7.6);
  const lbl=(t,x,yy)=>{ doc.setFont('helvetica','bold'); color(LBL); doc.text(t,x,yy); return x+doc.getTextWidth(t)+2; };
  const val=(t,x,yy,maxW)=>{ doc.setFont('helvetica','normal'); color(TXT); doc.text(doc.splitTextToSize(String(t||''),maxW)[0]||'',x,yy); };
  let x=lbl('DENOMINACIÓN DE LA ACCIÓN FORMATIVA:',L+5,y); val(s.denominacion||('Toolbox Talk HSE '+nombreMes+' '+String(S.anio).slice(2)),x,y,128-x);
  x=lbl('FECHA:',132,y); val(fmtF(s.fecha)||('  /'+String(S.mes).padStart(2,'0')+'/'+String(S.anio).slice(2)),x+3,y,40);
  y+=4.3;
  x=lbl('CENTRO DE TRABAJO/LUGAR REALIZACIÓN:',L+5,y); val(s.centro||S.cfg.centro,x,y,128-x);
  x=lbl('DURACIÓN:',134,y); val((s.duracion||S.cfg.duracion||'')+'  MIN',x+3,y,40);
  y+=4.3;
  x=lbl('FORMADOR:',L+5,y); val(s.formador||S.cfg.formador||'',x,y,110);
  y+=6;
  lbl('FIRMA:',L+5,y+3.5);
  doc.setFillColor(GREY[0],GREY[1],GREY[2]); doc.rect(L+18,y-1,62,11,'F');
  fit(S.cfg.firma_formador, formSig, L+20, y-0.5, 58, 10);
  y+=15;

  // ---- Contenidos (se ajusta el tamaño de letra para que quepa en la página 1)
  const COLW_L=92, COLW_R=CW-COLW_L, P=3;
  const espacioMax = FOOT_TOP - y - 6 - 30 - 36; // cabecera contenidos + comentarios + 2 filas
  function medir(k, draw, y0){
    let yl=y0+P+1, yr=y0+P+1;
    const fsT=11*k, fsB=7.4*k, lh=fsB*0.42, lhT=fsT*0.43;
    // izquierda
    doc.setFont('helvetica','bold'); doc.setFontSize(fsT); doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]);
    let ls=doc.splitTextToSize(tb.compromiso, COLW_L-2*P);
    if(draw) doc.text(ls, L+P, yl+lhT*0.8, {lineHeightFactor:1.15}); yl+=ls.length*lhT+3;
    doc.setFont('helvetica','normal'); doc.setFontSize(fsB); color(TXT);
    for(const par of (tb.cuerpo||'').split('\n').filter(Boolean)){ ls=doc.splitTextToSize(par, COLW_L-2*P); if(draw) doc.text(ls, L+P, yl+lh*0.8, {lineHeightFactor:1.15}); yl+=ls.length*lh+1.6; }
    if((tb.puntos||[]).length){
      yl+=1; doc.setFont('helvetica','bold'); if(draw) doc.text('Puntos para discusión:', L+P, yl+lh*0.8); yl+=lh+0.6; doc.setFont('helvetica','normal');
      for(const q of tb.puntos){ ls=doc.splitTextToSize(q, COLW_L-2*P); if(draw) doc.text(ls, L+P, yl+lh*0.8, {lineHeightFactor:1.15}); yl+=ls.length*lh+0.8; }
    }
    // derecha
    const xr=L+COLW_L+P, wr=COLW_R-2*P;
    if(tbSrc && tbImg){ const ih=Math.min(30*k, wr*tbImg.h/tbImg.w); if(draw) fit(tbSrc, tbImg, xr, yr, wr, ih, 'left'); yr+=ih+3; }
    if(tb.tema){ doc.setFont('helvetica','bold'); doc.setFontSize(fsT*0.95); doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]); ls=doc.splitTextToSize(tb.tema, wr); if(draw) doc.text(ls, xr, yr+lhT*0.8, {lineHeightFactor:1.15}); yr+=ls.length*lhT+2.5; }
    doc.setFont('helvetica','normal'); doc.setFontSize(fsB); color(TXT);
    for(const par of (tb.tema_intro||'').split('\n').filter(Boolean)){ ls=doc.splitTextToSize(par, wr); if(draw) doc.text(ls, xr, yr+lh*0.8, {lineHeightFactor:1.15}); yr+=ls.length*lh+1.4; }
    for(const it of (tb.tema_puntos||[])){ ls=doc.splitTextToSize(it, wr-3.5); if(draw){ doc.text('•', xr, yr+lh*0.8); doc.text(ls, xr+3.5, yr+lh*0.8, {lineHeightFactor:1.15}); } yr+=ls.length*lh+0.9; }
    return Math.max(yl,yr)-y0+P;
  }
  let k=1, hC=medir(k,false,y);
  while(hC>espacioMax && k>0.7){ k-=0.03; hC=medir(k,false,y); }
  // cabecera CONTENIDOS
  doc.setDrawColor(BORDER[0],BORDER[1],BORDER[2]); doc.setLineWidth(0.25);
  doc.rect(L,y,CW,6); doc.setFont('helvetica','bold'); doc.setFontSize(8); color(LBL); doc.text('CONTENIDOS', L+2.5, y+4.2);
  y+=6;
  doc.rect(L,y,COLW_L,hC); doc.rect(L+COLW_L,y,COLW_R,hC);
  medir(k,true,y);
  y+=hC+5;

  // ---- Comentarios / observaciones
  doc.setFillColor(GREY[0],GREY[1],GREY[2]); doc.rect(L,y,CW,5,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8); color(LBL); doc.text('Comentarios adicionales / Observaciones', L+2, y+3.6);
  y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.6); color(TXT);
  const obs = doc.splitTextToSize(s.observaciones||'', CW-6);
  const hObs = Math.max(14, obs.length*3.4+5);
  doc.rect(L,y,CW,hObs); if(obs.length) doc.text(obs, L+3, y+4.5, {lineHeightFactor:1.3});
  y+=hObs+6;

  // ---- Asistentes
  const CN=88, CP=52, CF=CW-CN-CP, RH=13;
  function cabTabla(){
    doc.setFillColor(GREY[0],GREY[1],GREY[2]); doc.rect(L,y,CW,9,'F'); doc.setDrawColor(BORDER[0],BORDER[1],BORDER[2]);
    doc.rect(L,y,CN,9); doc.rect(L+CN,y,CP,9); doc.rect(L+CN+CP,y,CF,9); doc.line(L,y+4.6,L+CN,y+4.6);
    color(LBL); doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
    doc.text('DATOS DE LOS ASISTENTES', L+CN/2, y+3.4, {align:'center'});
    doc.setFont('helvetica','normal'); doc.text('NOMBRE Y APELLIDOS', L+CN/2, y+7.8, {align:'center'});
    doc.setFont('helvetica','bold'); doc.text('PUESTO DE TRABAJO', L+CN+CP/2, y+5.6, {align:'center'}); doc.text('FIRMA', L+CN+CP+CF/2, y+5.6, {align:'center'});
    y+=9;
  }
  const firmas = d.firmas.filter(f=>f.firma).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const filas = firmas.length ? firmas : [null,null];
  if(y+9+RH > FOOT_TOP){ pie(); doc.addPage(); y=cabecera(); }
  cabTabla();
  for(const f of filas){
    if(y+RH > FOOT_TOP){ pie(); doc.addPage(); y=cabecera(); cabTabla(); }
    doc.setDrawColor(BORDER[0],BORDER[1],BORDER[2]); doc.rect(L,y,CN,RH); doc.rect(L+CN,y,CP,RH); doc.rect(L+CN+CP,y,CF,RH);
    if(f){
      doc.setFont('helvetica','normal'); doc.setFontSize(8.4); color(TXT);
      doc.text(doc.splitTextToSize(f.nombre, CN-6)[0], L+3, y+RH/2+1.3);
      doc.setFontSize(7.6); doc.text(doc.splitTextToSize(f.puesto||'', CP-4)[0]||'', L+CN+2.5, y+RH/2+1.2);
      fit(f.firma, sizes[f.id], L+CN+CP+2, y+0.8, CF-4, RH-4.2);
      doc.setFontSize(4.8); doc.setTextColor(120,120,120); doc.text('Firmado digitalmente '+fmtFH(f.firmado_en), L+CN+CP+CF/2, y+RH-0.9, {align:'center'});
    }
    y+=RH;
  }
  pie();
  return { doc, nombre: codigo + '.pdf' };
}
async function descargarPDF(btn){
  busy(btn,true);
  try{
    if(!window.jspdf) throw new Error('No se ha podido cargar el generador de PDF. Revisa la conexión.');
    const { doc, nombre } = await construirPDF();
    const blob = doc.output('blob');
    const file = new File([blob], nombre, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      try{ await navigator.share({files:[file], title:nombre}); } catch(e){ if(e.name!=='AbortError') throw e; }
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000);
    }
  }catch(e){ toast(e.message,true); }
  busy(btn,false);
}

function fEstado(f){
  if(f.tiene_firma) return f.eval_eficaz===true?['Firmada · eficaz','ok']:f.eval_eficaz===false?['Firmada · no eficaz','bad']:['Firmada','ok'];

function htmlFormacion(f, conDatos=true){
  const items=(f.items||[]);
  let h='';
  if(conDatos) h+=`<div class="card"><div class="small muted">REGISTRO DE FORMACIÓN PRÁCTICA EN EL PUESTO DE TRABAJO</div>
    <div class="li"><span class="grow small muted">Trabajador</span><b>${esc(f.nombre)}</b></div>
    <div class="li"><span class="grow small muted">Fecha</span><b>${fmtF(f.fecha)}</b></div>

    ${f.direccion?`<div class="li"><span class="grow small muted">Dirección de servicio</span><b>${esc(f.direccion)}</b></div>`:''}
    ${f.impartida?`<div class="li"><span class="grow small muted">Impartida por</span><b>${esc(f.impartida)}</b></div>`:''}
    <p class="small" style="margin:10px 0 0">Se muestran las instalaciones y equipos, se describen in situ las tareas a realizar y cómo realizarlas de forma segura (pautas preventivas básicas).</p></div>`;
  for(const n of items){
    if(n===6){ h+=`<div class="card read"><div class="tema">6. Otros</div><p>${esc(f.otros6||'')}</p></div>`; continue; }
    const r=F_REVERSO[n]; if(!r) continue;
    h+=`<div class="card read"><div class="tema">${n}. ${esc(F_ITEMS[n].charAt(0)+F_ITEMS[n].slice(1).toLowerCase())}</div><p>${esc(r.intro)}</p>`+
      r.g.map(([t,l])=>`<b style="display:block;margin:8px 0 4px;color:var(--navy)">${esc(t)}</b><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')+
      (n===1&&f.otros1?`<p><b>Otros:</b> ${esc(f.otros1)}</p>`:'')+`</div>`;
  }
  return h;
}
function textoFormacion(f){
  const p=['Formación práctica en el puesto de trabajo.','Se muestran las instalaciones y equipos, se describen las tareas a realizar y cómo realizarlas de forma segura.'];
  for(const n of (f.items||[])){
    if(n===6){ if(f.otros6) p.push('Otros. '+f.otros6); continue; }
    const r=F_REVERSO[n]; if(!r) continue;
    p.push(F_ITEMS[n]+'. '+r.intro); r.g.forEach(([t,l])=>{ p.push(t+'. '+l.join(' ')); });
  }
  return p.join(' ');
}

    ${[1,2,3,4,5,6].map(n=>`<label class="li" style="cursor:pointer;align-items:flex-start"><input type="checkbox" class="it" value="${n}" ${its.has(n)?'checked':''} style="width:22px;height:22px;margin-top:2px"><span class="grow"><span class="nm">${n}. ${F_ITEMS[n]}</span>${n===1?'<br><span class="small muted">Imagen profesional, normas básicas y generales, limpieza de superficies, baños, suelos y cristales</span>':''}</span></label>
      ${n===1?`<input class="inp" id="f_o1" placeholder="Otros (punto 1, opcional)" value="${esc(f.otros1||'')}" style="margin:0 0 6px">`:''}
      ${n===6?`<input class="inp" id="f_o6" placeholder="¿Qué otra formación?" value="${esc(f.otros6||'')}" style="margin:0 0 6px">`:''}`).join('')}
   </div>
   <div class="row">${nueva?`<button class="btn sec grow" id="g1">Guardar</button><button class="btn grow" id="g2">Guardar y enviar</button>`:`<button class="btn grow" id="g1">Guardar cambios</button>`}</div>`;
  if(nueva){ $('#todos').onclick=()=>document.querySelectorAll('.tw').forEach(c=>c.checked=true); $('#ninguno').onclick=()=>document.querySelectorAll('.tw').forEach(c=>c.checked=false); }
  const guardar=async(enviar,btn)=>{
    const p={fecha:$('#f_fec').value, duracion:$('#f_dur').value, direccion:$('#f_dir').value, impartida:$('#f_imp').value,
      items:[...document.querySelectorAll('.it:checked')].map(c=>c.value), otros1:$('#f_o1').value, otros6:$('#f_o6').value};
    if(!nueva) p.id=f.id; else p.trabajadores=[...document.querySelectorAll('.tw:checked')].map(c=>c.value);
    if(nueva && !p.trabajadores.length){ toast('Elige al menos un trabajador',true); return; }
    if(!p.items.length){ toast('Marca al menos un punto de “Formación en”',true); return; }
    busy(btn,true);
    try{
      const r=await rpc('prl_form_guardar',{p_tok:S.tok,p});
      if(enviar){ const e=await rpc('prl_form_enviar',{p_tok:S.tok,p_ids:r.ids}); toast(`Guardado y enviado a ${e.avisados}`); } else toast('Guardado');
      nueva && r.ids.length>1 ? pantallaFormaciones() : pantallaFormDetalle(r.ids[0]);
    }catch(err){ busy(btn,false); toast(err.message,true); }
  };
  $('#g1').onclick=e=>guardar(false,e.currentTarget);
  if($('#g2')) $('#g2').onclick=e=>guardar(true,e.currentTarget);
}

// ---- Jefe: detalle
async function pantallaFormDetalle(id){
  pararVoz();
  view(barra('Formación en el puesto', `<button class="ib" id="bk">‹</button>`, `<button class="ib" id="pdf">PDF</button>`) + `<div class="wrap" id="w"><div class="empty"><span class="spin dk"></span></div></div>`);
  $('#bk').onclick=pantallaFormaciones;
  let f; try{ [f,S.cfg]=await Promise.all([rpc('prl_form_ver',{p_tok:S.tok,p_id:id}), rpc('prl_config_leer',{p_tok:S.tok})]); }catch(e){ $('#w').innerHTML=`<div class="card">${esc(e.message)}</div>`; return; }
  if(!S.anio || +f.fecha.slice(0,4)!==S.anio) S.anio=+f.fecha.slice(0,4);
  $('#pdf').onclick=e=>pdfFormaciones([f.id], `F40R304 ${f.nombre} ${f.fecha}.pdf`, e.currentTarget);
  const [t,c]=fEstado(f);
  let h=`<div class="card"><div class="row"><b class="grow" style="font-size:18px">${esc(f.nombre)}</b><span class="chip ${c}">${t}</span></div>
    <div class="small muted" style="margin-top:4px">${fmtF(f.fecha)}${f.duracion?' · '+esc(f.duracion):''}${f.impartida?' · '+esc(f.impartida):''}</div>
    <div class="small" style="margin-top:8px">${(f.items||[]).map(n=>`${n}. ${F_ITEMS[n]}`).join('<br>')}${f.otros6?`<br><span class="muted">Otros: ${esc(f.otros6)}</span>`:''}</div></div>
  <div class="card"><b>Firma del trabajador</b>
    ${f.tiene_firma?`<div class="row" style="margin-top:8px"><img src="${f.firma}" style="max-height:60px;max-width:60%"><span class="grow small muted" style="text-align:right">${fmtFH(f.firmado_en)}<br><a href="#" id="qf">Borrar firma</a></span></div>`
      :`<div class="small muted" style="margin:6px 0 10px">${f.enviada_en?'Enviada '+fmtFH(f.enviada_en)+'. Esperando a que firme.':'Todavía no se la has enviado.'}</div>
        <div class="row"><button class="btn grow" id="env">${f.enviada_en?'🔔 Recordar':'📨 Enviar al trabajador'}</button><button class="btn sec grow" id="aqui">Firmar aquí</button></div>`}
  </div>
  <div class="card"><b>Evaluación de la eficacia</b><div class="small muted">Una vez consolidado el servicio en el puesto, evalúa si la formación ha sido eficaz.</div>
    <div class="row"><div class="grow"><label class="f">Fecha de evaluación</label><input class="inp" type="date" id="e_fec" value="${esc(f.eval_fecha||'')}"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn ${f.eval_eficaz===true?'ok':'sec'} grow" data-ef="true">Sí, eficaz</button><button class="btn ${f.eval_eficaz===false?'':'sec'} grow" data-ef="false" style="${f.eval_eficaz===false?'background:var(--bad);color:#fff':''}">No eficaz</button></div>
    <div id="nf" ${f.eval_eficaz===false?'':'hidden'}><label class="f">Fecha nueva formación</label><input class="inp" type="date" id="e_nf" value="${esc(f.nueva_fecha||'')}"></div>
    <button class="btn" id="e_save" style="margin-top:12px;width:100%">Guardar evaluación</button>
  </div>
  <div class="row"><button class="btn sec grow" id="ver">Ver lo que lee el trabajador</button></div>
  <div class="row" style="margin-top:10px"><button class="btn sec grow" id="edit">Editar</button><button class="btn bad grow" id="del">Borrar</button></div>
  ${!S.cfg.firma_resp?`<p class="small" style="color:var(--warn)">⚠︎ Falta la firma del responsable de centro para el PDF. <a href="#" id="gocfg">Añádela en Ajustes</a>.</p>`:''}
  ${!S.cfg.firma_formador?`<p class="small" style="color:var(--warn)">⚠︎ Falta tu firma de formador. <a href="#" id="gocfg2">Añádela en Ajustes</a>.</p>`:''}`;
  $('#w').innerHTML=h;
  let ef=f.eval_eficaz;
  document.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>{ ef = b.dataset.ef==='true'; document.querySelectorAll('[data-ef]').forEach(x=>{ const on=(x.dataset.ef==='true')===ef; x.className='btn grow '+(on?(ef?'ok':''):'sec'); x.style.cssText=on&&!ef?'background:var(--bad);color:#fff':''; }); $('#nf').hidden=ef!==false; if(!$('#e_fec').value) $('#e_fec').value=hoyISO(); });
  $('#e_save').onclick=async e=>{ const b=e.currentTarget; busy(b,true);
    try{ await rpc('prl_form_evaluar',{p_tok:S.tok,p_id:id,p:{eval_fecha:$('#e_fec').value,eval_eficaz:ef==null?'':String(ef),nueva_fecha:ef===false?$('#e_nf').value:''}}); toast('Evaluación guardada'); pantallaFormDetalle(id); }
    catch(err){ busy(b,false); toast(err.message,true); } };
  if($('#env')) $('#env').onclick=async e=>{ const b=e.currentTarget; busy(b,true);
    try{ const r=await rpc('prl_form_enviar',{p_tok:S.tok,p_ids:[id]}); toast(r.avisados?'Aviso enviado':'Ya estaba firmada'); pantallaFormDetalle(id); }catch(err){ busy(b,false); toast(err.message,true); } };
  if($('#aqui')) $('#aqui').onclick=()=>hojaFirma(f.nombre, 'Formación práctica en el puesto del '+fmtF(f.fecha)+'.<br>Al firmar confirma que ha recibido esta formación.', async png=>{
    await rpc('prl_form_firmar',{p_tok:S.tok,p_id:id,p_firma:png}); toast('Firma guardada'); pantallaFormDetalle(id); });
  if($('#qf')) $('#qf').onclick=async e=>{ e.preventDefault(); if(!confirm('¿Borrar la firma? Tendrá que volver a firmar.')) return; try{ await rpc('prl_form_quitar_firma',{p_tok:S.tok,p_id:id}); pantallaFormDetalle(id); }catch(err){ toast(err.message,true); } };
  $('#ver').onclick=()=>pantallaFormLeer(id);
  $('#edit').onclick=()=>pantallaFormEditar(f);
  $('#del').onclick=async()=>{ if(!confirm('¿Borrar esta formación?')) return; try{ await rpc('prl_form_borrar',{p_tok:S.tok,p_id:id}); toast('Borrada'); pantallaFormaciones(); }catch(err){ toast(err.message,true); } };
  ['gocfg','gocfg2'].forEach(k=>{ if($('#'+k)) $('#'+k).onclick=e=>{ e.preventDefault(); pantallaAjustes(); }; });
}

// ---- Firma desde una foto (fondo blanco -> transparente)
function firmaDeFoto(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const k=Math.min(1,500/im.width,240/im.height), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x=c.getContext('2d'); x.drawImage(im,0,0,c.width,c.height); const d=x.getImageData(0,0,c.width,c.height), p=d.data;
    for(let i=0;i<p.length;i+=4){ const l=(p[i]*0.3+p[i+1]*0.59+p[i+2]*0.11); if(l>170){ p[i+3]=0; } else { p[i]=p[i+1]=Math.round(l*0.3); p[i+2]=Math.round(l*0.5); p[i+3]=255; } }
    x.putImageData(d,0,0); res(c.toDataURL('image/png')); }; im.onerror=()=>rej(new Error('No se ha podido leer la imagen')); im.src=r.result; }; r.readAsDataURL(file); });
}

// ---- PDF: rellena la plantilla oficial F40R304
let _pdfLib=null;
function cargarPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);
  if(_pdfLib) return _pdfLib;
  _pdfLib=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; s.onload=()=>res(window.PDFLib); s.onerror=()=>{ _pdfLib=null; rej(new Error('No se ha podido cargar el generador de PDF. Revisa la conexión.')); }; document.head.appendChild(s); });
  return _pdfLib;
}
async function rellenarF40(PDFLib, plantillaBytes, f, cfg){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc=await PDFDocument.load(plantillaBytes);
  const font=await doc.embedFont(StandardFonts.Helvetica), bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const pg=doc.getPage(0), H=pg.getHeight(), ink=rgb(0.05,0.1,0.3);
  const txt=(t,x,yTop,size=10,fnt=font,maxW=330)=>{ t=String(t||''); while(t && fnt.widthOfTextAtSize(t,size)>maxW) t=t.slice(0,-1); if(t) pg.drawText(t,{x,y:H-yTop,size,font:fnt,color:ink}); };
  const X=(x0,x1,yTop,yBot)=>{ const cx=(x0+x1)/2, cy=H-(yTop+yBot)/2, s=Math.min(x1-x0,yBot-yTop)*0.32; pg.drawLine({start:{x:cx-s,y:cy-s},end:{x:cx+s,y:cy+s},thickness:1.4,color:ink}); pg.drawLine({start:{x:cx-s,y:cy+s},end:{x:cx+s,y:cy-s},thickness:1.4,color:ink}); };
  const img=async(dataUrl,x0,yTop,x1,yBot)=>{ if(!dataUrl) return; const bytes=Uint8Array.from(atob(dataUrl.split(',')[1]),c=>c.charCodeAt(0));
    const im=/^data:image\/png/.test(dataUrl)?await doc.embedPng(bytes):await doc.embedJpg(bytes); const w=x1-x0, h=yBot-yTop, k=Math.min(w/im.width,h/im.height);
    pg.drawImage(im,{x:x0+(w-im.width*k)/2,y:H-yBot+(h-im.height*k)/2,width:im.width*k,height:im.height*k}); };
  // Cabecera
  txt(f.direccion,200,173.3,10.5,bold); txt(f.nombre,200,201,10.5,bold); txt(fmtF(f.fecha),200,228.2,10.5,bold);
  txt(f.duracion,200,257.7,10.5,bold); txt(f.impartida,200,286.6,10.5,bold);
  // Casillas "Formación en"
  const filas={1:[355,365],2:[406,420.5],3:[428.5,442.5],4:[460.5,475],5:[483,497.5],6:[507.5,520.5]};
  for(const n of (f.items||[])) if(filas[n]) X(511,538.5,filas[n][0],filas[n][1]);
  if(f.otros1) txt(f.otros1,212,390,8,font,290);
  if(f.otros6){ const w=f.otros6; txt(w,215,516.5,9,font,285); }
  // Firmas
  await img(cfg.firma_resp, 49,596, 161,643);
  await img(cfg.firma_formador, 221,596, 363,643);
  await img(f.firma, 404,596, 536,643);
  if(f.firmado_en){ pg.drawText('Firmado digitalmente '+fmtFH(f.firmado_en),{x:404,y:H-652,size:5.5,font,color:rgb(0.45,0.45,0.45)}); }
  // Evaluación de la eficacia
  if(f.eval_fecha) txt(fmtF(f.eval_fecha),120,739.5,9,bold);
  if(f.eval_eficaz===true) X(279,296.5,745.5,758.5);
  if(f.eval_eficaz===false){ X(335,349,745.5,758.5); if(f.nueva_fecha) txt(fmtF(f.nueva_fecha),484,755.5,8.5,bold); }
  return doc;
}
async function pdfFormaciones(ids, nombre, btn){
  busy(btn,true);
  try{
    const [PDFLib, plantilla, lista, cfg] = await Promise.all([
      cargarPdfLib(),
      fetch(PLANTILLA_F40).then(r=>{ if(!r.ok) throw new Error('No se encuentra la plantilla del F40R304'); return r.arrayBuffer(); }),
      rpc('prl_form_firmas',{p_tok:S.tok,p_ids:ids}),
      rpc('prl_config_leer',{p_tok:S.tok})
    ]);
    const salida = await PDFLib.PDFDocument.create();
    for(const f of lista){
      const d = await rellenarF40(PDFLib, plantilla, f, cfg);
      const pags = await salida.copyPages(d, d.getPageIndices());
      pags.forEach(p=>salida.addPage(p));
    }
    const bytes = await salida.save();
    const blob = new Blob([bytes],{type:'application/pdf'});
    const file = new File([blob], nombre, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      try{ await navigator.share({files:[file], title:nombre}); } catch(e){ if(e.name!=='AbortError') throw e; }
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000);
    }
  }catch(e){ toast(e.message,true); }
  busy(btn,false);
}
