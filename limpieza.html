<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#EEF2F6;--surf:#fff;--surf2:#F5F8FB;--ink:#16212C;--mut:#5C6B7A;--line:#D6DEE6;--acc:#1F4E79;--acc2:#2E6DA4;--ok:#1E7A46;--okbg:#E3F3EA;--warn:#A86400;--warnbg:#FFF2DB;--bad:#B3261E;--badbg:#FDE7E5;--r:12px}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;padding:10px 16px calc(10px);display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{background:#16324D}}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.02em}header .who{font-size:13px;opacity:.9}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 16px 90px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;padding:12px 4px 14px;font-size:13px;font-weight:600;color:var(--mut);border-top:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--acc);border-top-color:var(--acc)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.hd h2{font-size:15px;margin:0;flex:1;text-transform:uppercase;letter-spacing:.05em}
.bd{padding:12px 14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;min-height:46px}
.btn.sec{background:var(--surf2);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.peq{padding:8px 12px;min-height:36px;font-size:14px}

.ot .t{font-weight:700;font-size:17px}.ot .d{color:var(--mut);font-size:14px}

.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.pill.info{background:#E3EEF9;color:var(--acc);border-color:transparent}
@media (prefers-color-scheme:dark){.pill.info{background:#16324D}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto}
.pad button{font-size:24px;font-weight:700;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
.dots{display:flex;justify-content:center;gap:12px;margin:10px 0}.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc)}.dots span.on{background:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}.kpis div{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.kpis b{display:block;font-size:22px}.kpis small{color:var(--mut);font-size:12px}
.datebar{display:flex;align-items:center;gap:8px;margin:0 0 12px}.datebar b{flex:1;text-align:center;font-size:16px;text-transform:capitalize}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}

@media (min-width:700px){.ov{align-items:center}.dlg{border-radius:16px}}
.dlg h3{margin:0 0 12px;font-size:18px}

.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surf2);font-weight:700;cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf2);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.fotos{display:flex;flex-wrap:wrap;gap:8px}.fotos img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.empty{padding:22px 14px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#16212C;color:#fff;padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;max-width:90vw}
.hint{color:var(--mut);font-size:13px;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.bar{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
</style>
</head>

<script>
(function(){

const $=id=>document.getElementById(id);
function el(t,a,k){const e=document.createElement(t);if(a)for(const x in a){const v=a[x];if(v==null||v===false)continue;if(x==="text")e.textContent=v;else if(x==="html")e.innerHTML=v;else if(x.startsWith("on"))e[x]=v;else e.setAttribute(x,v===true?"":v);}
  (Array.isArray(k)?k:k!=null?[k]:[]).flat(9).forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}};
function toast(t){const d=el("div",{class:"toast",text:t});document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
async function rpc(fn,args){const r=await fetch(URL_SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){const m=(j&&j.message)||txt||("Error "+r.status);const k=Object.keys(ERR).find(x=>m.includes(x));if(k==="SESION"){salir(true);}throw new Error(k?ERR[k]:m);}
  if(j&&j.error){throw new Error(ERR[j.error]||j.error);}return j;}
const hoyISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const sumaD=(f,n)=>{const d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const fLarga=f=>new Date(f+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
const fCorta=f=>new Date(f+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"numeric"});
const hora=ts=>ts?new Date(ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"";
const finde=f=>{const d=new Date(f+"T12:00:00").getDay();return d===0||d===6;};
let S={tok:ls.get("limp.tok"),yo:JSON.parse(ls.get("limp.yo")||"null"),tab:"hoy",fecha:hoyISO()};
function salir(sinAviso){if(S.tok)rpc("salir",{p_tok:S.tok}).catch(()=>{});S.tok=null;S.yo=null;ls.set("limp.tok",null);ls.set("limp.yo",null);if(!sinAviso)toast("Sesión cerrada");pinta();}
$("bsalir").onclick=()=>salir();
function dlg(titulo,cuerpo,botones){const ov=el("div",{class:"ov"});const cerrar=()=>ov.remove();
  const bs=(botones||[{t:"Cerrar",cls:"sec"}]).map(b=>el("button",{class:"btn "+(b.cls||""),text:b.t,onclick:async e=>{if(!b.fn){cerrar();return;}e.target.disabled=true;try{const r=await b.fn();if(r!==false)cerrar();}catch(er){toast(er.message);}e.target.disabled=false;}}));
  ov.appendChild(el("div",{class:"dlg",role:"dialog","aria-modal":"true"},[el("h3",{text:titulo}),cuerpo,el("div",{class:"row",style:"margin-top:12px"},bs)]));
  ov.onclick=e=>{if(e.target===ov)cerrar();};document.body.appendChild(ov);return cerrar;}
const fld=(l,c)=>el(/^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)?"label":"div",{class:"f"},[el("span",{text:l}),c]);
function inp(v,on,a){const i=el("input",Object.assign({value:v==null?"":v},a||{}));i.oninput=()=>on(i.value);return i;}

function sel(ops,v,on){const s=el("select",null,ops.map(([k,t])=>el("option",{value:k,text:t})));s.value=v==null?"":v;s.onchange=()=>on(s.value);return s;}

/* ---------- entrar ---------- */
async function vEntrar(v){v.appendChild(el("p",{class:"hint",style:"font-size:16px;margin:8px 0 14px",text:"¿Quién eres? Toca tu nombre."}));
  const box=el("div",{class:"names"},el("div",{class:"empty",text:"Cargando…"}));v.appendChild(box);
  try{const L=await rpc("lista_trabajadores");box.textContent="";L.forEach(w=>box.appendChild(el("button",{text:w.nombre,onclick:()=>pinPad(w)})));}
  catch(e){box.textContent="";box.appendChild(el("div",{class:"empty",text:"No se puede conectar. Revisa la conexión. ("+e.message+")"}));}}
function pinPad(w){let pin="",pin1=null;const nuevo=!w.tiene_pin;const msg=el("p",{class:"hint",style:"text-align:center;font-size:15px"});const dots=el("div",{class:"dots"});
  const pintaDots=()=>{dots.textContent="";for(let i=0;i<Math.max(4,pin.length);i++)dots.appendChild(el("span",{class:i<pin.length?"on":""}));msg.textContent=nuevo?(pin1==null?"Es tu primera vez: inventa un PIN de 4 números":"Repite el PIN para confirmarlo"):"Pon tu PIN";};
  const pad=el("div",{class:"pad"});let cerrar;
  const listo=async()=>{if(pin.length<4)return;if(nuevo&&pin1==null){pin1=pin;pin="";pintaDots();return;}if(nuevo&&pin!==pin1){toast("No coinciden, vuelve a empezar");pin1=null;pin="";pintaDots();return;}
    try{const r=await rpc("entrar",{p_id:w.id,p_pin:pin});S.tok=r.token;S.yo=r.yo;ls.set("limp.tok",r.token);ls.set("limp.yo",JSON.stringify(r.yo));cerrar();S.tab="hoy";S.fecha=hoyISO();pinta();}
    catch(e){toast(e.message);pin="";pintaDots();}};
  ["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(k=>pad.appendChild(el("button",{text:k,"aria-label":k==="⌫"?"Borrar":k==="✓"?"Entrar":k,onclick:()=>{if(k==="⌫")pin=pin.slice(0,-1);else if(k==="✓"){listo();return;}else if(pin.length<8)pin+=k;pintaDots();if(pin.length===4&&!nuevo)listo();}})));
  pintaDots();cerrar=dlg(w.nombre,el("div",null,[msg,dots,pad]),[{t:"Cancelar",cls:"sec"}]);}

/* ---------- tarjeta de OT ---------- */
function tarjeta(o,re){const [et,ec]=EST[o.estado]||["?",""];const admin=S.yo.rol==="admin";
  const quien=o.todo_equipo?"Todo el equipo "+(o.equipo||""):(o.nombres||[]).join(", ");
  const acc=[];
  if(o.estado==="pendiente")acc.push(el("button",{class:"btn peq",text:"Empezar",onclick:()=>cambia(o,"en_curso",re)}));
  if(o.estado==="pendiente"||o.estado==="en_curso"){acc.push(el("button",{class:"btn ok peq",text:"Terminar",onclick:()=>terminar(o,re)}));acc.push(el("button",{class:"btn sec peq",text:"No se pudo",onclick:()=>noHecha(o,re)}));}
  if(o.estado==="hecha"||o.estado==="no_hecha")acc.push(el("button",{class:"btn sec peq",text:"Reabrir",onclick:()=>cambia(o,"pendiente",re)}));
  acc.push(el("button",{class:"btn sec peq",text:"📷 Fotos"+(o.nfotos?" ("+o.nfotos+")":""),onclick:()=>verFotos(o,re)}));
  if(admin)acc.push(el("button",{class:"btn sec peq",text:"Editar",onclick:()=>formOT(o,re)}));
  return el("div",{class:"ot"},[el("div",{style:"display:flex;gap:8px;align-items:flex-start"},[el("div",{class:"t",style:"flex:1",text:o.titulo}),el("span",{class:"pill "+ec,text:et})]),
    o.descripcion?el("div",{class:"d",text:o.descripcion}):null,
    el("div",{class:"meta"},[o.fecha!==S.fecha?el("span",{class:"pill bad",text:"Atrasada · "+fCorta(o.fecha)}):null,o.prioridad==="alta"?el("span",{class:"pill bad",text:"Urgente"}):null,o.turno?el("span",{text:"⏱ "+o.turno}):null,quien?el("span",{text:"👤 "+quien}):null,
      o.resultado?el("span",{class:"pill "+(o.resultado==="OK"?"ok":"bad"),text:"Checklist "+o.resultado}):null,o.hecho_por_n&&o.estado!=="pendiente"?el("span",{text:(o.estado==="en_curso"?"Empezó ":"Por ")+o.hecho_por_n+(o.fin?" a las "+hora(o.fin):o.inicio?" a las "+hora(o.inicio):"")}):null,o.nota?el("span",{text:"📝 "+o.nota}):null]),
    el("div",{class:"row",style:"flex-wrap:wrap"},acc)]);}
async function cambia(o,e,re,nota){try{await rpc("estado_ot",{p_tok:S.tok,p_ot:o.id,p_estado:e,p_nota:nota||null});toast(EST[e][0]);re();}catch(er){toast(er.message);}}
function noHecha(o,re){let n="";dlg("No se pudo hacer",el("div",null,[fld("¿Por qué?",area("",x=>n=x))]),[{t:"Cancelar",cls:"sec"},{t:"Guardar",cls:"bad",fn:async()=>{if(!n.trim()){toast("Explica el motivo");return false;}await cambia(o,"no_hecha",re,n.trim());}}]);}
function segOK(v,on){const b=[["OK","v-ok"],["NO-OK","v-no"],["N/A","v-na"]].map(([k,c])=>el("button",{type:"button",class:c,"aria-pressed":String(v===k),text:k,onclick:()=>{on(k);b.forEach(x=>x.setAttribute("aria-pressed",String(x.textContent===k)));}}));return el("div",{class:"seg"},b);}
function terminar(o,re){const ck=Object.assign({},o.checklist||{}),fin=Object.assign({},o.checklist_final||{});const conFin=finde(o.fecha)||o.equipo==="Finde";let nota="";const fotos=[];
  const fbox=el("div",{class:"fotos"});
  const body=el("div",null,[el("p",{class:"hint",text:"Marca cómo ha quedado cada punto."}),el("div",{class:"chk"},CHECK.map(k=>el("div",{class:"it"},[el("b",{text:k}),segOK(ck[k],v=>ck[k]=v)]))),
    conFin?el("div",null,[el("b",{text:"Material al terminar"}),el("div",{class:"chk"},CHECK_FIN.map(k=>el("div",{class:"it"},[el("span",{text:k}),segOK(fin[k],v=>fin[k]=v)])))]):null,
    fld("Nota (opcional)",area("",x=>nota=x)),
    el("label",{class:"btn sec",style:"display:block;text-align:center;cursor:pointer"},["📷 Añadir foto",el("input",{type:"file",accept:"image/*",capture:"environment",style:"display:none",onchange:async e=>{const f=e.target.files[0];if(!f)return;const d=await comprime(f);fotos.push(d);fbox.appendChild(el("img",{src:d,alt:"foto"}));}})]),fbox]);
  dlg("Terminar: "+o.titulo,body,[{t:"Cancelar",cls:"sec"},{t:"Guardar como hecha",cls:"ok",fn:async()=>{const falta=CHECK.filter(k=>!ck[k]);if(falta.length){toast("Falta marcar: "+falta[0]);return false;}

    await cambia(o,"hecha",re,nota.trim());}}]);}
function comprime(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1280,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.7,d=c.toDataURL("image/jpeg",q);while(d.length>650000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q);}ok(d);};im.onerror=ko;im.src=r.result;};r.onerror=ko;r.readAsDataURL(f);});}
async function verFotos(o,re){const box=el("div",{class:"fotos"},el("div",{class:"empty",text:"Cargando…"}));
  const add=el("label",{class:"btn sec",style:"display:block;text-align:center;cursor:pointer;margin-top:10px"},["📷 Añadir foto",el("input",{type:"file",accept:"image/*",capture:"environment",style:"display:none",onchange:async e=>{const f=e.target.files[0];if(!f)return;try{await rpc("foto_add",{p_tok:S.tok,p_ot:o.id,p_data:await comprime(f)});toast("Foto guardada");carga();re();}catch(er){toast(er.message);}}})]);
  const carga=async()=>{try{const L=await rpc("fotos_ot",{p_tok:S.tok,p_ot:o.id});box.textContent="";if(!L.length)box.appendChild(el("p",{class:"hint",text:"Sin fotos todavía."}));L.forEach(x=>box.appendChild(el("a",{href:x.data,target:"_blank",title:(x.por||"")+" "+hora(x.creado)},el("img",{src:x.data,alt:"foto de "+(x.por||"")}))));}catch(e){box.textContent=e.message;}};
  dlg("Fotos · "+o.titulo,el("div",null,[box,add]));carga();}
