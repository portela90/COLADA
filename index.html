*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}

const db={

const sinP=col=>P&&col.startsWith(P)?col.slice(P.length):col;
const keyIt=it=>it&&typeof it==="object"?(it.id!=null?"id:"+it.id:it.i!=null?"i:"+it.i:JSON.stringify(it)):String(it);
const hayItems=d=>d&&Array.isArray(d.items);
function difItems(a,b){const A=new Map(((a&&a.items)||[]).map(x=>[keyIt(x),x])),B=new Map(((b&&b.items)||[]).map(x=>[keyIt(x),x]));const add=[],del=[],chg=[];
  B.forEach((v,k)=>{if(!A.has(k))add.push(v);else if(JSON.stringify(A.get(k))!==JSON.stringify(v))chg.push([A.get(k),v]);});A.forEach((v,k)=>{if(!B.has(k))del.push(v);});return{add,del,chg};}
function descIt(col,it){try{const f=window.descCambio&&window.descCambio(sinP(col),it);if(f)return f;}catch(e){}
  const o=Object.assign({},it);delete o.id;delete o.i;delete o.ts;return JSON.stringify(o).replace(/[{}"]/g,"").slice(0,90);}

  const dias=Math.round((new Date(hoyD.toDateString())-new Date(d.toDateString()))/864e5);return(dias===0?"hoy":dias===1?"ayer":d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"}))+" "+hh;};
async function cargaHist(){
  let q=sb.from("docs_hist").select("h,col,id,data,op,at,by").order("h",{ascending:false}).limit(200);
  q=P?q.like("col",P+"%"):q.not("col","like","alm_%");
  const r=await q;if(r.error)throw r.error;const rows=(r.data||[]).filter(x=>x.col!=="zz"&&x.col!==P+"notas");
  const cur={};for(const c of [...new Set(rows.map(x=>x.col))]){const ids=[...new Set(rows.filter(x=>x.col===c).map(x=>x.id))];
    for(let i=0;i<ids.length;i+=100){const d=await sb.from("docs").select("id,data").eq("col",c).in("id",ids.slice(i,i+100));if(d.error)throw d.error;(d.data||[]).forEach(z=>{cur[c+"\u0001"+z.id]=z.data;});}}

  rows.forEach(x=>{const k=x.col+"\u0001"+x.id;const despues=vistos.has(k)?sig[k]:(k in cur?cur[k]:null);const ultimo=!vistos.has(k);vistos.add(k);sig[k]=x.data;
    const antes=x.data;if(JSON.stringify(antes)===JSON.stringify(despues))return;
    let lineas;if(hayItems(antes)||hayItems(despues)){const d=difItems(antes,despues);
      lineas=d.add.map(v=>"＋ "+descIt(x.col,v)).concat(d.del.map(v=>"✕ "+descIt(x.col,v)+" (borrado)")).concat(d.chg.map(([a,b])=>"✎ "+descIt(x.col,b)));

    ch.push({x,k,antes,despues,ultimo,lineas});});

  const grupos=[];ch.forEach(c=>{const g=grupos[grupos.length-1];const t=Date.parse(c.x.at);

async function deshacerGrupo(g){

    const r=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();if(r.error)throw r.error;const ahora=r.data?r.data.data:null;
    if(hayItems(c.antes)||hayItems(c.despues)){const d=difItems(c.antes,c.despues);const quitar=new Set(d.add.map(keyIt));const viejo=new Map(d.chg.map(([a])=>[keyIt(a),a]));
      let items=((ahora&&ahora.items)||[]).filter(it=>!quitar.has(keyIt(it))).map(it=>viejo.has(keyIt(it))?viejo.get(keyIt(it)):it);
      const hay=new Set(items.map(keyIt));d.del.forEach(it=>{if(!hay.has(keyIt(it)))items.push(it);});

    else if(c.antes==null){const w=await sb.from("docs").delete().eq("col",col).eq("id",id);if(w.error)throw w.error;}
    else{const w=await sb.from("docs").upsert({col,id,data:c.antes});if(w.error)throw w.error;}}

const downloads={save:async({filename,data})=>{const bl=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":/\.xlsx$/.test(filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"application/octet-stream"});
  const u=URL.createObjectURL(bl),a=h("a",{href:u,download:filename});document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},4000);}};

window.claude={use:async n=>{if(n==="db"){await acceso();return db;}if(n==="assets"){await acceso();return assets;}if(n==="downloads")return downloads;return null;}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

<script>
(function(){
"use strict";
const TABS=[["stock","Stock"],["consumo","Consumo"],["entrada","Entrada"],["lotes","Lotes"],["hist","Consultas"],["precios","Precios"],["plan","Plan"]];
const MAT={"L-2630":{nom:"AlSi9",al:"blanca blanco",col:"var(--blanca)"},"L-2521-B":{nom:"AlSi12",al:"azul",col:"var(--azul)"}};
const NAVES=["Nave 1","Nave 2"];
const TURNOS=["Mañana","Tarde","Noche"];
let db=null,ready=false,lotes=[],meses={},cfg={minimos:{},granalla:{inicial:0,min:0},proveedores:[],precios:{},plan:{},paros:[],calendario:{}},tab="stock";
const draft={cons:{},ent:{},granE:{},granC:{},plan:{},ent2:{},rel:{},bpSig:{}};
let consModo="relevo";
let planMes=null,parteDia="";
/* máquinas de cada nave; su estado (marcha/parada, cobre, azul) se guarda como
   cambios con fecha en la colección "maq", para saber qué había cada día */
const MAQ={"Nave 1":["F4","F10","F15","F16","F19","F20","F21","F22","F25","F26","F27","F28","F29","F30","F31","F32","F33","F34"],
  "Nave 2":["F51","F52","F53","F54","F55","F56","F61","F62","F63","F64","F65","F66","F67"]};
let maqEv={},mqFecha="",mqTurno="",maqAbierto=true;
const TI=t=>TURNOS.indexOf(t);
/* relevo según la hora: mañana 6-14, tarde 14-22, noche 22-6 */
const turnoAhora=()=>{const h=new Date().getHours();return h>=6&&h<14?"Mañana":(h>=14&&h<22?"Tarde":"Noche");};
let filtro={desde:"",hasta:"",tipo:"",nave:"",mat:"",turno:"",texto:""};
const $=id=>document.getElementById(id);
function el(t,a,k){const n=document.createElement(t);if(a)for(const p in a){if(p==="class")n.className=a[p];else if(p==="text")n.textContent=a[p];else if(p.slice(0,2)==="on")n.addEventListener(p.slice(2),a[p]);else if(a[p]!=null)n.setAttribute(p,a[p]);}if(k)(Array.isArray(k)?k:[k]).forEach(c=>c&&n.appendChild(c));return n;}
/* números escritos a la española: admite coma o punto decimal */
const numES=v=>parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));
const fmt=n=>(Math.round(n||0)).toLocaleString("es-ES");
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const mesDe=f=>(f||hoy()).slice(0,7);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const key=(n,m)=>n+"|"+m;
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dmy=f=>f?f.slice(8,10)+"/"+f.slice(5,7):"—";
function toast(m){const o=$("toast");if(o)o.remove();const t=el("div",{id:"toast",text:m});document.body.appendChild(t);setTimeout(()=>t.parentNode&&t.remove(),2600);}
let CORTE=null;
function movs(){const o=[];for(const m in meses)for(const r of(meses[m]||[]))if(!CORTE||!r.f||r.f<=CORTE)o.push(r);return o;}
function conCorte(f,fn){const o=CORTE;CORTE=f;try{return fn();}finally{CORTE=o;}}
/* El parte es del último día COMPLETO con consumo: lo que se va apuntando
   hoy no entra hasta mañana. Si solo hay consumos de hoy, se usa hoy. */
function diaParte(){const h=hoy(),f=movs().filter(r=>r.t==="C"&&!r.h&&r.f).map(r=>r.f).sort();
  const a=f.filter(x=>x<h);return a.length?a[a.length-1]:(f.length?f[f.length-1]:null);}

/* ---------- fotos de albarán ---------- */
const fotoUrl=id=>window.fotoUrlWeb?window.fotoUrlWeb(id):"/_blob/"+id;
function verFoto(id){
  const ov=el("div",{class:"lightbox",onclick:e=>{if(e.target===e.currentTarget)e.currentTarget.remove();}},[
    el("img",{src:fotoUrl(id),alt:"Albarán"}),
    el("button",{class:"btn sec",type:"button",text:"Cerrar",onclick:e=>e.currentTarget.parentNode.remove()})
  ]);
  document.body.appendChild(ov);
}
/* Se reduce antes de subir: una foto de iPad son 4-5 MB y no hace falta tanto
   para leer un albarán, pero sí la suficiente para que se lea la letra. */
function comprimir(file,maxLado){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{
      try{
        const esc=Math.min(1,maxLado/Math.max(i.width,i.height));
        if(esc>=1&&file.size<3500000){URL.revokeObjectURL(u);return res(file);}
        const c=document.createElement("canvas");
        c.width=Math.round(i.width*esc);c.height=Math.round(i.height*esc);
        c.getContext("2d").drawImage(i,0,0,c.width,c.height);
        c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file);},"image/jpeg",0.88);
      }catch(e){URL.revokeObjectURL(u);res(file);}
    };
    i.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    i.src=u;
  });
}
async function subirFoto(file){
  const a=await claude.use("assets");
  if(!a)throw new Error("sin assets");
  const b=await comprimir(file,3000);
  const r=await a.upload(b);
  return r.id;
}

/* ---------- cálculo ---------- */
function saldos(){
  const act=movs().filter(r=>!r.h);
  const res={};
  lotes.forEach(l=>{
    const ent=act.filter(r=>r.d===l.id),sal=act.filter(r=>r.o===l.id);
    let kN=l.kgInv||0,fN=l.fardosInv||0;
    ent.forEach(r=>{if(typeof r.kg==="number")kN+=r.kg;if(typeof r.fa==="number")fN+=r.fa;});
    res[l.id]={l,ent,sal,ratio:fN>0?Math.round(kN/fN*100)/100:0};
  });
  for(const id in res){
    const s=res[id],ap=r=>typeof r.kg==="number"?r.kg:(r.t==="C"&&typeof r.fa==="number"&&r.o&&res[r.o]?Math.round(r.fa*res[r.o].ratio):0);
    let kg=s.l.kgInv||0,fa=s.l.fardosInv||0;
    s.ent.forEach(r=>{kg+=ap(r);fa+=(typeof r.fa==="number"?r.fa:0);});
    s.sal.forEach(r=>{kg-=ap(r);fa-=(typeof r.fa==="number"?r.fa:0);});
    s.kg=kg;s.fa=fa;
  }
  return res;
}
function kgAp(r,S){return typeof r.kg==="number"?r.kg:(r.t==="C"&&typeof r.fa==="number"&&r.o&&S[r.o]?Math.round(r.fa*S[r.o].ratio):0);}
/* consumo medio = fardos consumidos / nº de días distintos con consumo (tu fórmula del Excel) */
function diasConConsumo(){const d={};movs().forEach(r=>{if(r.t==="C"&&r.f)d[r.f]=1;});return Object.keys(d).length;}
function bloques(diaFijo){
  const S=saldos(),dias=diasConConsumo()||1,mesAct=mesDe(hoy());
  const ud=diaFijo||(()=>{const f=movs().filter(r=>r.t==="C"&&!r.h&&r.f).map(r=>r.f).sort();return f.length?f[f.length-1]:null;})();
  const B={};
  NAVES.forEach(n=>Object.keys(MAT).forEach(m=>{B[key(n,m)]={nave:n,mat:m,kg:0,fa:0,kgN:0,faN:0,kgE:0,faE:0,cFa:0,cUd:0,cUdFa:0,eMes:0};}));
  lotes.forEach(l=>{const s=S[l.id];if(!s)return;const b=B[key(l.nave,l.material)];if(!b)return;
    b.kg+=s.kg;b.fa+=s.fa;if(l.donde==="externo"){b.kgE+=s.kg;b.faE+=s.fa;}else{b.kgN+=s.kg;b.faN+=s.fa;}});
  movs().forEach(r=>{
    const l=lotes.find(x=>x.id===(r.o||r.d));
    const nv=l?l.nave:r.nv, ml=l?l.material:r.ml;
    if(!nv||!ml)return;const b=B[key(nv,ml)];if(!b)return;
    if(r.t==="C"){b.cFa+=(typeof r.fa==="number"?r.fa:0);if(r.f===ud){b.cUd+=Math.abs(kgAp(r,S));b.cUdFa+=(typeof r.fa==="number"?r.fa:0);}}
    if(r.t==="E"&&!r.h&&r.f&&r.f.slice(0,7)===mesAct)b.eMes+=kgAp(r,S);
  });
  for(const k in B){const b=B[k];b.medio=Math.round(b.cFa/dias*100)/100;b.dias=b.medio>0?Math.round(b.faN/b.medio):null;}
  return {S,B,ud,dias};
}
function granallaKg(){let k=(cfg.granalla&&cfg.granalla.inicial)||0;movs().forEach(r=>{if(r.t==="G"&&typeof r.kg==="number")k+=r.kg;});return k;}
function estado(b,mn){
  if(b.kg<0||b.fa<0)return["bad","Negativo"];
  const m=(mn&&mn.fardosNave)||0;
  if(m<=0)return["na","Sin mínimo"];
  if(b.faN<m)return["bad","Bajo mínimo"];
  if(b.faN<m*1.35)return["warn","Cerca del mínimo"];
  return["ok","OK"];
}
/* FIFO: la colada más antigua en nave de esa nave+aleación */
function fifoLista(nave,mat,S){
  return lotes.filter(l=>l.nave===nave&&l.material===mat&&l.donde==="nave"&&S[l.id]&&S[l.id].fa>0)
              .sort((a,b)=>(a.entrada||"").localeCompare(b.entrada||"")||a.nombre.localeCompare(b.nombre,"es"));
}

/* ---------- escritura ---------- */
/* Apuntes dentro del documento de cada mes. En la web se hace en la base de
   datos en una sola operación (dos personas a la vez no se pisan). */
async function itemsAdd(col,id,items){if(db.itemsAdd)return db.itemsAdd(col,id,items);
  const ref=db.doc(col+"/"+id),sn=await ref.get();const it=sn.exists?((sn.data().items)||[]).slice():[];await ref.set({items:it.concat(items)});}
async function itemsPut(col,id,item){if(db.itemsPut)return db.itemsPut(col,id,item);
  const ref=db.doc(col+"/"+id),sn=await ref.get();await ref.set({items:((sn.exists&&sn.data().items)||[]).map(r=>r.i===item.i?item:r)});}
async function itemsDel(col,id,i){if(db.itemsDel)return db.itemsDel(col,id,i);
  const ref=db.doc(col+"/"+id),sn=await ref.get();if(!sn.exists)return;await ref.set({items:((sn.data().items)||[]).filter(r=>r.i!==i)});}
async function addMov(rec){await itemsAdd("mov",mesDe(rec.f),[rec]);}
/* varios apuntes de golpe: una sola escritura por mes */
async function addMovs(recs){const g={};recs.forEach(r=>{const m=mesDe(r.f);(g[m]=g[m]||[]).push(r);});
  for(const m in g)await itemsAdd("mov",m,g[m]);}
/* guardar un apunte editado (mismo id). Si cambia de mes, primero se escribe
   en el mes nuevo y luego se quita del viejo, para no perderlo nunca. */
async function guardarMov(orig,nuevo){
  const mO=mesDe(orig.f),mN=mesDe(nuevo.f);
  if(mO===mN)await itemsPut("mov",mO,nuevo);
  else{await addMov(nuevo);await delMov(orig.i,orig.f);}
}
async function delMov(id,f){await itemsDel("mov",mesDe(f),id);}
/* Borrar un apunte de consumo o entrada con aviso claro. Si es la entrada que
   creó la colada y no tiene nada más, también se quita la colada vacía. */
/* Ventanas propias: la página publicada bloquea confirm() y prompt() del
   navegador (devuelven "cancelar" sin mostrarse), por eso no se podía borrar. */
function dialogo(o){return new Promise(res=>{
  const prev=document.activeElement;
  const inp=o.input?el("input",{type:"text",inputmode:o.teclado||"numeric",value:o.valor||"",class:"num",autocomplete:"off"}):null;
  let hecho=false;const fin=v=>{if(hecho)return;hecho=true;ov.remove();document.removeEventListener("keydown",tec);try{prev&&prev.focus&&prev.focus();}catch(e){}res(v);};
  const bOk=el("button",{type:"button",class:"btn"+(o.peligro?" peligro":""),text:o.ok||"Aceptar",onclick:()=>fin(inp?inp.value:true)});
  const bNo=el("button",{type:"button",class:"btn sec",text:o.cancel||"Cancelar",onclick:()=>fin(null)});
  const bEx=o.extra?el("button",{type:"button",class:"btn sec",text:o.extra.text,onclick:()=>fin(o.extra.valor)}):null;
  const box=el("div",{class:"dlg",role:"dialog","aria-modal":"true"},[
    o.titulo?el("h3",{text:o.titulo}):null,
    ...String(o.texto||"").split("\n\n").map(t=>el("p",{},t.split("\n").flatMap((l,k)=>k?[el("br",{}),document.createTextNode(l)]:[document.createTextNode(l)]))),
    inp?el("label",{},[inp]):null,
    el("div",{class:"dlg-b"},[bNo,bEx,bOk])]);
  const ov=el("div",{class:"dlg-ov",onclick:e=>{if(e.target===ov)fin(null);}},[box]);
  const tec=e=>{if(e.key==="Escape")fin(null);else if(e.key==="Enter"&&inp&&document.activeElement===inp)fin(inp.value);};
  document.addEventListener("keydown",tec);document.body.appendChild(ov);
  setTimeout(()=>{if(inp){inp.focus();inp.select();}else bOk.focus();},30);
});}
const confirmar=(texto,o)=>dialogo(Object.assign({texto},o||{})).then(v=>v===true);
const preguntar=(texto,valor,o)=>dialogo(Object.assign({texto,input:true,valor},o||{}));
/* ---------- Editar un apunte ----------
   Se cambia en su sitio (mismo id): fecha, relevo, colada, fardos, kilos… */
function editarApunte(r){
  if(!r||r.h||r.t==="T")return;
  const S=saldos(),l=lotes.find(x=>x.id===(r.o||r.d));
  const T={C:"consumo",E:"entrada",A:"ajuste",G:"granalla de cobre"};
  const v={f:r.f||hoy(),u:r.u||TURNOS[0],lote:r.o||r.d||"",fa:typeof r.fa==="number"?String(Math.abs(r.fa)):"",kg:typeof r.kg==="number"?String(Math.abs(r.kg)).replace(".",","):"",a:r.a||(l&&r.t==="E"?l.albaran:"")||"",nv:r.nv||NAVES[0]};
  const campos=[];
  const inp=(lab,key,o)=>el("label",{text:lab},[el("input",Object.assign({class:"num",type:"text",value:v[key],oninput:e=>{v[key]=e.target.value;}},o||{}))]);
  campos.push(el("label",{text:"Fecha"},[el("input",{type:"date",max:hoy(),value:v.f,onchange:e=>{v.f=e.target.value;}})]));
  if(r.t==="C"||(r.t==="G"&&!r.aj)){const seg=el("div",{class:"seg"});const pin=()=>{seg.textContent="";TURNOS.forEach(t=>seg.appendChild(el("button",{type:"button","aria-pressed":String(v.u===t),text:t,onclick:()=>{v.u=t;pin();}})));};pin();
    campos.push(el("label",{text:"Relevo"},[seg]));}
  if(r.t==="G"&&!r.aj&&r.kg<0){const seg=el("div",{class:"seg"});const pin=()=>{seg.textContent="";NAVES.forEach(n=>seg.appendChild(el("button",{type:"button","aria-pressed":String(v.nv===n),text:n,onclick:()=>{v.nv=n;pin();}})));};pin();
    campos.push(el("label",{text:"Nave"},[seg]));}
  if(r.t==="C"&&l){
    const cand=lotes.filter(x=>x.nave===l.nave&&x.material===l.material&&x.donde==="nave"&&((S[x.id]&&S[x.id].fa>0)||x.id===l.id))
      .sort((a,b)=>(a.entrada||"").localeCompare(b.entrada||"")||a.nombre.localeCompare(b.nombre,"es"));
    campos.push(el("label",{text:"Colada ("+l.nave+" · "+MAT[l.material].nom+")"},[el("select",{onchange:e=>{v.lote=e.target.value;}},
      cand.map(x=>{const o=el("option",{value:x.id,text:x.nombre+" · "+fmt(S[x.id]?S[x.id].fa:0)+" f"+(x.id===l.id?" (la actual)":"")});if(x.id===v.lote)o.selected=true;return o;}))]));}
  if(r.t!=="G")campos.push(inp("Fardos","fa",{inputmode:"numeric"}));
  if(r.t==="C")campos.push(inp("Kilos (opcional, en blanco se calculan)","kg",{inputmode:"decimal"}));
  if(r.t==="E"||r.t==="G")campos.push(inp("Kilos","kg",{inputmode:"decimal"}));
  if(r.t==="E")campos.push(el("label",{text:"Nº albarán"},[el("input",{type:"text",value:v.a,oninput:e=>{v.a=e.target.value;}})]));
  const err=el("div",{class:"banner b",hidden:""});
  const cerrar=()=>{ov.remove();document.removeEventListener("keydown",tec);};
  const guardar=async e=>{
    const fa=numES(v.fa),kg=numES(v.kg),n=Object.assign({},r,{f:v.f});const mal=[];
    if(!v.f)mal.push("Pon la fecha.");
    if(r.t!=="G"&&!(fa>0))mal.push("Los fardos tienen que ser un número mayor que 0.");
    if((r.t==="E"||r.t==="G")&&!(kg>0))mal.push("Los kilos tienen que ser un número mayor que 0.");
    if(r.t==="C"&&v.kg.trim()!==""&&!(kg>0))mal.push("Los kilos no son un número válido.");
    if(mal.length){err.textContent=mal.join(" ");err.hidden=false;return;}
    if(r.t==="C"){n.u=v.u;n.o=v.lote;n.fa=fa;
      const kgOrig=typeof r.kg==="number"?String(Math.abs(r.kg)).replace(".",","):"";
      if(v.kg.trim()===""||(v.lote!==r.o&&v.kg===kgOrig))delete n.kg;else n.kg=kg;}
    if(r.t==="G"){n.kg=r.kg<0?-kg:kg;if(!r.aj){n.u=v.u;if(r.kg<0)n.nv=v.nv;}}
    if(r.t==="E"){n.fa=fa;n.kg=kg;if(v.a.trim())n.a=v.a.trim();else delete n.a;}
    if(r.t==="A"){n.fa=fa;const b=S[r.o||r.d];n.kg=Math.round(fa*((b&&b.ratio)||0));}
    n.ed=hoy();
    const b=e.currentTarget;b.disabled=true;
    try{await guardarMov(r,n);
      if(r.t==="E"&&l){const up={};if(l.entrada!==v.f)up.entrada=v.f;if((l.albaran||"")!==(n.a||""))up.albaran=n.a||"";if(Object.keys(up).length)await db.doc("lotes/"+l.id).update(up);}
      cerrar();toast("Apunte corregido");
    }catch(x){b.disabled=false;err.textContent="No se pudo guardar. Inténtalo otra vez.";err.hidden=false;}};
  const tec=e=>{if(e.key==="Escape")cerrar();};
  const ov=el("div",{class:"dlg-ov",onclick:e=>{if(e.target===ov)cerrar();}},[el("div",{class:"dlg",role:"dialog","aria-modal":"true","aria-label":"Editar apunte"},[
    el("h3",{text:"Editar "+(T[r.t]||"apunte")}),
    el("p",{class:"sub",text:(l?l.nombre+" · "+l.nave:(r.t==="G"?"Granalla de cobre":""))}),
    el("form",{onsubmit:e=>e.preventDefault()},campos.concat([err])),
    el("div",{class:"dlg-b"},[el("button",{type:"button",class:"btn sec",text:"Cancelar",onclick:cerrar}),el("button",{type:"button",class:"btn",text:"Guardar",onclick:guardar})])])]);
  document.addEventListener("keydown",tec);document.body.appendChild(ov);
}
async function borrarApunte(r,i,kg,fa){
  const T={C:"consumo",E:"entrada",A:"ajuste",G:"apunte de granalla de cobre",T:"traslado"};
  const tipo=T[r.t]||"apunte";
  let txt="¿Borrar este "+tipo+"?\n\n"+dmy(r.f)+(r.u?" · "+r.u:"")+"\n"+(i.colada||"")+(i.nave?" · "+i.nave:"")+"\n"+(fa?fmt(Math.abs(fa))+" fardos · ":"")+fmt(Math.abs(kg))+" kg";
  let lote=null,otros=[];
  if(r.t==="E"){const id=r.d||r.o;lote=lotes.find(x=>x.id===id)||null;
    otros=todosMovs().filter(x=>x.i!==r.i&&(x.o===id||x.d===id));
    if(otros.length)txt+="\n\nOjo: esta colada ya tiene "+otros.length+" apunte(s) más (consumos, traslados…). Si borras la entrada, su stock puede quedar en negativo.";}
  txt+="\n\nEl stock se recalcula.";
  if(!(await confirmar(txt,{titulo:"Borrar apunte",ok:"Borrar",peligro:true})))return false;
  await delMov(r.i,r.f);
  if(lote&&!otros.length&&!(lote.kgInv>0)&&!(lote.fardosInv>0)){try{await db.doc("lotes/"+lote.id).delete();}catch(e){}}
  return true;
}
async function saveCfg(){await db.doc("cfg/app").set(cfg);}

/* ---------- vistas ---------- */
/* Parte diario: una línea por nave Y aleación, nunca mezcladas.
   Es lo que Cristian le pasa a su jefe cada mañana. */
function vParte(B,ud,ahora){
  const gk=granallaKg();

/* Ajuste por recuento físico: se pone lo que hay de verdad y se apunta la
   diferencia como ajuste (no cuenta como consumo ni en el consumo medio). */
async function ajustarLote(l,b){
  const r=await preguntar("Recuento de "+l.nombre+" ("+l.nave+", "+MAT[l.material].nom+")\n\nLa app tiene "+fmt(b.fa)+" fardos. ¿Cuántos hay de verdad?",String(b.fa),{titulo:"Ajustar colada",ok:"Siguiente"});
  if(r===null)return;
  const n=parseInt(String(r).trim(),10);
  if(!(n>=0)||String(n)!==String(r).trim()){toast("Pon un número entero de fardos");return;}
  const dif=n-b.fa;
  if(dif===0){toast("Cuadra, no hace falta ajuste");return;}
  const kg=Math.round(Math.abs(dif)*(b.ratio||0));
  const sg=dif>0?"+":"−";
  if(!(await confirmar("Ajuste de "+sg+fmt(Math.abs(dif))+" fardos ("+sg+fmt(kg)+" kg) en "+l.nombre+".\n\nQuedará en "+fmt(n)+" fardos. ¿Lo apunto?",{titulo:"Confirmar ajuste",ok:"Apuntar"})))return;
  const rec={i:uid("m"),t:"A",f:hoy(),kg,fa:Math.abs(dif),n:"Ajuste por recuento físico: "+n+" fardos (la app tenía "+b.fa+")"};
  if(dif>0)rec.d=l.id;else rec.o=l.id;
  try{await addMov(rec);toast("Ajuste apuntado");}catch(e){toast("No se pudo apuntar el ajuste");}
}

function rangoRapido(k){

  if(k==="ayer")return[p(1),p(1)];
  if(k==="7")return[p(6),hoy()];

}

function informeMes(m){

  if(completo)Object.values(R).forEach(x=>{x.inv={fa:x.ini.fa,kg:x.ini.kg};x.entApp=x.ent;x.conApp=x.con;
    x.ini={fa:x.inv.fa-x.entPrev.fa+x.conPrev.fa,kg:x.inv.kg-x.entPrev.kg+x.conPrev.kg,faN:null,kgN:null,faE:null,kgE:null};

  /* cuadre: inicial + entradas − consumo ± ajustes tiene que dar el final */
  Object.values(R).forEach(x=>{const eK=x.ini.kg+x.ent.kg-x.con.kg+x.aju.kg,eF=x.ini.fa+x.ent.fa-x.con.fa+x.aju.fa;

  /* valoración: todo al precio del mes de cada aleación */
  const precio={};Object.keys(MAT).forEach(mt=>precio[mt]=precioMedio(m,mt));

}

   y las coladas del externo del inventario (que están enteras). Por aleación y,
   si hay al menos 3, por proveedor. Si no hay datos, 37 f / 25.000 kg. */
function mediaCamion(mat,prov){
  const m=[];
  todosMovs().forEach(r=>{if(r.t==="E"&&!r.h&&r.fa>0){const l=lotes.find(x=>x.id===r.d);if(l)m.push({mat:l.material,p:nrm(l.proveedor||r.p||""),fa:r.fa,kg:r.kg||0});}});
  lotes.forEach(l=>{if(l.donde==="externo"&&l.fardosInv>0&&!/^Parte de/.test(l.obs||""))m.push({mat:l.material,p:nrm(l.proveedor||""),fa:l.fardosInv,kg:l.kgInv||0});});
  const med=a=>a.length?{fa:a.reduce((s,x)=>s+x.fa,0)/a.length,kg:a.reduce((s,x)=>s+x.kg,0)/a.length,n:a.length}:null;
  const pp=prov?med(m.filter(x=>x.mat===mat&&x.p===nrm(prov))):null;if(pp&&pp.n>=3)return pp;
  const pm=mat?med(m.filter(x=>x.mat===mat)):null;if(pm&&pm.n>=3)return pm;
  return med(m)||{fa:FA_CAM,kg:KG_CAM,n:0};
}

function precioDe(mes,prov,mat){const P=cfg.precios||{},k=(prov||"").toUpperCase();
  const ms=Object.keys(P).filter(m=>m<=mes).sort().reverse();
  for(const m of ms){const p=P[m]||{};
    if(mat==="L-2521-B"){const v=(p.provAz||{})[k];if(v>0)return{v,m};}
    else{const v=(p.prov||{})[k];if(v>0)return{v,m};}}

      return{r,l,nave,mat,colada,txt};}).filter(x=>{if(!ok(x.txt))return false;
        if(F.mes&&(x.r.f||"").slice(0,7)!==mesAct)return false;

      &&a.lotes.some(fL)&&(!F.mes||(a.f||"").slice(0,7)===mesAct))
    .sort((a,b)=>(b.f||"").localeCompare(a.f||""));
