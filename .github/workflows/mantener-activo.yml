# Mantener activos los proyectos de Supabase (plan gratuito): Supabase pausa un proyecto tras 7 días sin actividad
# (p. ej. en vacaciones) y la app deja de funcionar hasta reactivarlo a mano. Esto hace una consulta pequeña cada día.
# Las claves son las publicables (las mismas que van en las páginas), no son secretas.
# GitHub apaga las tareas programadas tras 60 días sin cambios en el repositorio: el último paso vuelve a activarla.
name: Mantener activo Supabase
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a colada-mapri (Coladas, Almacén, Inicio)
        run: |
          c=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 "https://whemhkcrgwyjucpaswrm.supabase.co/rest/v1/docs?select=id&limit=1" -H "apikey: sb_publishable_hcFf66q2-0X6pR1gq5YKpw_u4G6HriG")
          echo "colada-mapri: $c"; case "$c" in 2*|401|403|404) ;; *) echo "::error::colada-mapri no contesta ($c): puede estar pausado"; exit 1;; esac
      - name: Consulta a limpieza-cie (Limpieza)
        run: |
          c=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 "https://uddejncrjcyyaxjocbpj.supabase.co/rest/v1/ots?select=id&limit=1" -H "apikey: sb_publishable_UqnQLvLkCI0kk_y1KDt94Q_ccYmLw2i")
          echo "limpieza-cie: $c"; case "$c" in 2*|401|403|404) ;; *) echo "::error::limpieza-cie no contesta ($c): puede estar pausado"; exit 1;; esac
      - name: Que GitHub no apague esta tarea por inactividad
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mantener-activo.yml/enable" || true
