const snap=rows=>({docs:rows.map(r=>({id:r.id,data:()=>r.data}))});
const subs={};
function canal(col,fn){col=P+col;(subs[col]=subs[col]||[]).push(fn);
  if(subs[col].length===1)sb.channel("docs-"+col).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{subs[col].forEach(f=>f(p));}).subscribe(st=>{if(st==="SUBSCRIBED")subs[col].forEach(f=>f(null));});}
async function leeCol(col){const r=await sb.from("docs").select("id,data").eq("col",P+col);if(r.error)throw r.error;return r.data||[];}
async function leeDoc(col,id){const r=await sb.from("docs").select("data").eq("col",P+col).eq("id",id).maybeSingle();if(r.error)throw r.error;return r.data;}
const rpc=async(f,a)=>{const r=await sb.rpc(f,a);if(r.error)throw r.error;};
const db={
  itemsAdd:(col,id,items)=>rpc("docs_items_add",{p_col:P+col,p_id:id,p_items:items}),
  itemsPut:(col,id,item)=>rpc("docs_items_put",{p_col:P+col,p_id:id,p_item:item}),
  itemsDel:(col,id,i)=>rpc("docs_items_del",{p_col:P+col,p_id:id,p_i:i}),
  collection:col=>({onSnapshot:(cb,er)=>{const go=()=>leeCol(col).then(rows=>cb(snap(rows))).catch(e=>er&&er(e));go();canal(col,go);return()=>{};}}),
  doc:path=>{const [col,id]=path.split("/");return{
    get:async()=>{const d=await leeDoc(col,id);return{exists:!!d,data:()=>d?d.data:undefined};},
    set:async data=>{const r=await sb.from("docs").upsert({col:P+col,id,data});if(r.error)throw r.error;},
    update:async patch=>{const d=await leeDoc(col,id);const r=await sb.from("docs").upsert({col:P+col,id,data:Object.assign({},d?d.data:{},patch)});if(r.error)throw r.error;},
    onSnapshot:(cb,er)=>{const go=()=>leeDoc(col,id).then(d=>cb({exists:!!d,data:()=>d?d.data:undefined})).catch(e=>er&&er(e));go();canal(col,p=>{if(!p||(p.new&&p.new.id===id)||(p.old&&p.old.id===id))go();});return()=>{};}};}
};

  const u=URL.createObjectURL(bl),a=h("a",{href:u,download:filename});document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},4000);}};

window.claude={use:async n=>{if(n==="db"){await acceso();return db;}if(n==="assets"){await acceso();return assets;}if(n==="downloads")return downloads;return null;}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

    else if(m.tipo==="ajuste")add(m.art,m.alm,c);else if(m.tipo==="traslado"){add(m.art,m.alm,-c);add(m.art,m.dest,c);}});
  return s;}

function datosInforme(desde,hasta){const en=f=>f>=desde&&f<=hasta;const cam=todosPist().filter(p=>en(p.f));
  const pids=DIAM.map(pistArt).filter(Boolean);const ids=pids.map(a=>a.id);
  const aj=todosMov().filter(m=>m.tipo==="ajuste"&&ids.includes(m.art)&&en(m.f)&&m.cant);const ent=todosMov().filter(m=>m.tipo==="entrada"&&ids.includes(m.art)&&en(m.f));
  const porD={};cam.forEach(p=>{porD[p.diam]=(porD[p.diam]||0)+(+p.cant||1);});return{cam,aj,ent,porD,pids};}
function respTxt(r){if(!r)return"sin indicar";const t=String(r).trim();const o=(cat.operarios||[]).find(x=>(x.num&&String(x.num)===t)||(x.nom&&norm(x.nom)===norm(t)));if(o&&o.num&&o.nom)return"Nº "+o.num+" · "+o.nom;return /^\d+$/.test(t)?"Nº "+t:t;}
function almDeCambio(p){if(!p.movId)return"";const m=todosMov().find(x=>x.id===p.movId);return m?almN(m.alm):"";}
function textoInforme(desde,hasta){const{cam,porD}=datosInforme(desde,hasta);const tot=Object.values(porD).reduce((a,b)=>a+b,0);
  const L=["CAMBIOS DE PISTÓN · MAPRI",desde===hasta?"Día "+fmtF(desde):"Del "+fmtF(desde)+" al "+fmtF(hasta),""];
  if(!cam.length){L.push("No se ha cambiado ningún pistón en este periodo.");return L.join("\n");}
  L.push("RESUMEN ("+tot+" pistones):");DIAM.forEach(x=>{if(porD[x]){const a=pistArt(x);L.push("- "+(a&&a.cod?"["+a.cod+"] ":"")+"Pistón "+x+": "+porD[x]+" ud");}});
  L.push("","DETALLE DE CADA CAMBIO:");
  cam.forEach((p,i)=>{const mq=cat.maquinas.find(z=>z.id===p.maq);const a=pistArt(p.diam);
    L.push("",""+(i+1)+". "+fmtF(p.f)+" · Inyectora "+maqN(p.maq)+(mq&&mq.nave?" ("+mq.nave+")":""));
    L.push("   Pistón "+p.diam+(a&&a.cod?" ["+a.cod+"]":"")+" · "+(+p.cant||1)+" ud");
    L.push("   Motivo: "+cap(p.motivo||"—"));
    L.push("   Responsable: "+respTxt(p.resp));
    if(p.dest)L.push("   Pistón usado: "+cap(p.dest));
    const al=almDeCambio(p);if(al)L.push("   Salió de: "+al);
    if(p.nota)L.push("   Observaciones: "+p.nota);});
  return L.join("\n");}
